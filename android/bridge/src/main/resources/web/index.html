<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞秋网页版</title>
<style>
  :root {
    --bg: #12161c;
    --panel: #1a1f27;
    --panel-2: #212733;
    --line: #2b323d;
    --fg: #e6eaf0;
    --fg-dim: #8b97a8;
    --accent: #2196f3;
    --ok: #2fbf71;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .brand { font-size: 20px; font-weight: 700; color: var(--accent); }
  .meta { color: var(--fg-dim); font-size: 13px; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #7a2b2b; flex: 0 0 auto; }
  .dot.ok { background: var(--ok); }
  button {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 260px; flex: 0 0 auto; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto;
  }
  .peer { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .peer:hover { background: var(--panel-2); }
  .peer.on { background: #1e3a55; box-shadow: inset 3px 0 0 var(--accent); }
  .pn { font-size: 15px; font-weight: 600; }
  .pi { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .empty { padding: 20px 16px; color: var(--fg-dim); font-size: 13px; }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 18px; }
  #msgs.drag { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .msg { display: flex; flex-direction: column; margin-bottom: 14px; }
  .msg.out { align-items: flex-end; }
  .msg.in { align-items: flex-start; }
  .who { font-size: 12px; color: var(--fg-dim); margin-bottom: 3px; }
  .bubble {
    max-width: 68%; padding: 10px 14px; border-radius: 12px;
    white-space: pre-wrap; word-break: break-word; font-size: 16px;
  }
  .msg.out .bubble { background: var(--accent); color: #fff; }
  .msg.in .bubble { background: var(--panel-2); }
  .t { font-size: 11px; color: var(--fg-dim); margin-top: 4px; }
  .card {
    max-width: 68%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center;
  }
  .card .ic {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: 9px;
    background: #1e3a55; color: var(--accent); display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .card .info { min-width: 0; }
  .card .nm { font-weight: 600; word-break: break-all; }
  .card .sz { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .card img { max-width: 320px; max-height: 300px; border-radius: 8px; display: block; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  form {
    display: flex; gap: 10px; padding: 14px 18px;
    background: var(--panel); border-top: 1px solid var(--line); flex: 0 0 auto;
  }
  input[type=text] {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--fg); padding: 11px 14px; font-size: 16px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  form button[type=submit] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 11px 22px; }
  @media (max-width: 720px) {
    aside { width: 150px; }
    .bubble, .card { max-width: 84%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">飞秋</div>
  <div class="meta" id="meta">连接中…</div>
  <div class="meta" id="prog" style="flex:0 0 auto;min-width:120px;text-align:right"></div>
  <button id="refresh" type="button">刷新设备</button>
  <div class="dot" id="conn" title="实时连接状态"></div>
</header>

<main>
  <aside id="peers"><div class="empty">正在搜索局域网设备…</div></aside>
  <section>
    <div id="msgs"></div>
    <form id="composer" autocomplete="off">
      <input id="text" type="text" placeholder="输入消息，回车发送" autocomplete="off">
      <button type="button" id="sendImg">发图片</button>
      <button type="button" id="sendFile">发文件</button>
      <button type="submit">发送</button>
    </form>
  </section>
</main>

<input type="file" id="pickFile" style="display:none">
<input type="file" id="pickImg" accept="image/*" style="display:none">

<script>
(function () {
  var peers = [];
  var current = null;
  var $ = function (id) { return document.getElementById(id); };
  var msgs = $('msgs');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function timeText(ms) {
    try { return new Date(ms).toLocaleTimeString(); } catch (e) { return ''; }
  }
  function bottom() { msgs.scrollTop = msgs.scrollHeight; }
  function clearMsgs() { msgs.innerHTML = ''; }

  function renderPeers() {
    if (!peers.length) {
      $('peers').innerHTML = '<div class="empty">还没有发现设备。<br>确认对方和本机在同一网段，且路由器没开 AP 隔离。</div>';
      return;
    }
    $('peers').innerHTML = peers.map(function (p) {
      var on = p.ip === current ? ' on' : '';
      return '<div class="peer' + on + '" data-ip="' + esc(p.ip) + '">' +
        '<div class="pn">' + esc(p.name) + '</div>' +
        '<div class="pi">' + esc(p.ip) + (p.group ? ' · ' + esc(p.group) : '') + '</div>' +
        '</div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.peer'), function (el) {
      el.onclick = function () { current = el.getAttribute('data-ip'); renderPeers(); $('text').focus(); };
    });
  }

  function wrap(cls, who, inner, time) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = '<div class="who">' + esc(who) + '</div>' + inner +
      '<div class="t">' + esc(timeText(time || Date.now())) + '</div>';
    msgs.appendChild(d);
    bottom();
    return d;
  }

  function addMessage(m) {
    wrap(m.outgoing ? 'out' : 'in', m.outgoing ? '我' : (m.peer || ''),
      '<div class="bubble">' + esc(m.text) + '</div>', m.time);
  }

  function addImage(ev) {
    wrap('in', ev.peer || '',
      '<div class="card"><img src="' + esc(ev.url) + '" alt="' + esc(ev.name) + '"></div>', ev.time);
  }

  function addOffer(o) {
    var d = wrap('in', o.peer || '',
      '<div class="card">' +
      '<div class="ic">' + (o.isDir ? '夹' : '文') + '</div>' +
      '<div class="info"><div class="nm">' + esc(o.name) + '</div>' +
      '<div class="sz">' + (o.isDir ? '文件夹' : fmtSize(o.size)) + ' · 等待接收</div>' +
      '<div class="bar"><i></i></div></div>' +
      '<button type="button" class="acc">接收</button>' +
      '</div>');
    var btn = d.querySelector('.acc');
    btn.onclick = function () {
      btn.disabled = true;
      btn.textContent = '接收中…';
      fetch('/api/accept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: 'key=' + encodeURIComponent(o.key)
      }).catch(function () { btn.disabled = false; btn.textContent = '接收'; });
    };
  }

  function addBlob(b) {
    if (b.image) { addImage({ peer: b.peer, url: b.url, name: b.name, time: b.time }); return; }
    wrap('in', b.peer || '',
      '<div class="card">' +
      '<div class="ic">文</div>' +
      '<div class="info"><div class="nm">' + esc(b.name) + '</div>' +
      '<div class="sz">' + fmtSize(b.size) + '</div></div>' +
      '<a href="' + esc(b.url) + '" download><button type="button">下载</button></a>' +
      '</div>', b.time);
  }

  function setProgress(p) {
    if (!p.total) { $('prog').textContent = ''; return; }
    var pct = Math.min(100, Math.round(p.done * 100 / p.total));
    $('prog').textContent = (p.outgoing ? '发送 ' : '接收 ') + pct + '%';
    if (p.done >= p.total) setTimeout(function () { $('prog').textContent = ''; }, 1500);
  }

  function connect() {
    var es = new EventSource('/api/events');
    es.addEventListener('open', function () { $('conn').classList.add('ok'); });
    es.addEventListener('error', function () { $('conn').classList.remove('ok'); });

    es.addEventListener('info', function (e) {
      var d = JSON.parse(e.data);
      $('meta').textContent = d.nick + ' · ' + (d.localIp || '未知 IP') +
        ':' + d.httpPort + ' · 协议端口 ' + d.protocolPort;
    });
    es.addEventListener('peers', function (e) {
      peers = JSON.parse(e.data);
      if (current && !peers.some(function (p) { return p.ip === current; })) current = null;
      renderPeers();
    });
    es.addEventListener('history', function (e) {
      clearMsgs();
      JSON.parse(e.data).forEach(addMessage);
    });
    es.addEventListener('files', function (e) {
      var d = JSON.parse(e.data);
      (d.offers || []).forEach(addOffer);
      (d.blobs || []).forEach(addBlob);
    });
    es.addEventListener('message', function (e) { addMessage(JSON.parse(e.data)); });
    es.addEventListener('image', function (e) { addImage(JSON.parse(e.data)); });
    es.addEventListener('file-offered', function (e) { addOffer(JSON.parse(e.data)); });
    es.addEventListener('file-done', function (e) { addBlob(JSON.parse(e.data)); });
    es.addEventListener('file-failed', function (e) {
      var d = JSON.parse(e.data);
      wrap('in', d.peer || '', '<div class="card"><div class="ic">!</div>' +
        '<div class="info"><div class="nm">' + esc(d.name || d.key || '文件') + '</div>' +
        '<div class="sz">失败：' + esc(d.error || '对方已取消或网络中断') + '</div></div></div>');
    });
    es.addEventListener('progress', function (e) { setProgress(JSON.parse(e.data)); });
  }

  function upload(file, inline) {
    if (!current) { alert('请先在左边选择一个设备'); return; }
    $('prog').textContent = '上传中…';
    var url = '/api/upload?peer=' + encodeURIComponent(current) +
      '&name=' + encodeURIComponent(file.name) +
      '&inline=' + (inline ? 1 : 0);
    fetch(url, { method: 'POST', body: file })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        $('prog').textContent = '';
        if (!j || !j.ok) alert('发送失败：' + ((j && j.error) || '未知错误'));
      })
      .catch(function () { $('prog').textContent = ''; alert('发送失败'); });
  }

  $('composer').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = $('text').value.trim();
    if (!text) return;
    if (!current) { alert('请先在左边选择一个设备'); return; }
    $('text').value = '';
    fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: 'peer=' + encodeURIComponent(current) + '&text=' + encodeURIComponent(text)
    }).catch(function () { alert('发送失败，检查网页服务是否还在运行'); });
  });

  $('sendFile').onclick = function () { $('pickFile').click(); };
  $('sendImg').onclick = function () { $('pickImg').click(); };
  $('pickFile').onchange = function () { if (this.files[0]) upload(this.files[0], false); this.value = ''; };
  $('pickImg').onchange = function () { if (this.files[0]) upload(this.files[0], true); this.value = ''; };

  ['dragenter', 'dragover'].forEach(function (t) {
    msgs.addEventListener(t, function (e) { e.preventDefault(); msgs.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    msgs.addEventListener(t, function (e) { e.preventDefault(); msgs.classList.remove('drag'); });
  });
  msgs.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) upload(f, f.type.indexOf('image/') === 0);
  });

  $('refresh').addEventListener('click', function () {
    fetch('/api/refresh', { method: 'POST' }).catch(function () {});
  });

  connect();
})();
</script>
</body>
</html>
